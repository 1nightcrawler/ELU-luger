<ul>
    {% for book in books %}
    <li>
        <a href="{{ url_for('.book_info', book_id = book.id) }}">
            <div id="book-thumbnail">
                <img 
                    src="{{ url_for('static', filename='assets/placeholder_book_cover.jpg') }}"
                >
            </div>
            <div id="book-info">
                <h2>{{ book.title }}</h2>
                <span>{{ book.author }}</span>
                <div id="user_book_progress">
                    <div id="progress-bar">
                        <progress value="20" max="100"></progress>
                        <span>X% loetud</span>
                    </div>
                </div>
            </div>
        </a>
    </li>
    {% endfor %}
</ul>
