<!DOCTYPE html>
<html lang="et" class="bg-blue-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='dist/tailwind.css') }}">
    <script type="module" src="{{ url_for('static', filename='dist/app.js') }}"></script>
    <title>Valt-e</title>
    <script src="{{ url_for('static', filename='js/device-keys.js') }}" defer></script>
</head>
<body class="flex flex-col min-h-dvh">
    <header>
        <div id="header" class="fixed top-0 left-0 right-0 overflow-hidden m-2">
            {% block header %} {% endblock %}
        </div>
    </header>
    <main class="flex-1 overflow-y-auto pt-17 pb-8">
        <div id="content" class="p-5">
            {% block content %} {% endblock %}
        </div>
    </main>
    <footer class="sticky bottom-0 left-0 right-0 overflow-hidden">
        <div id="navigation">
            {% block footer %} {% endblock %}
        </div>
    </footer>
    {% block scripts %} {% endblock %}
</body>
</html>
